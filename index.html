<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Typographic Jellyfish — 3D</title>

  <link rel="stylesheet" href="./style.css">

  <!-- Three.js の読み込み設定 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- 3Dクラゲ表示エリア -->
  <div id="scene"></div>

  <!-- タイトル・操作パネル -->
  <div class="hud">
    <div class="eyebrow">GENERATIVE / DEEP SEA</div>

    <h1>TYPE / JELLY</h1>

    <p>
      Drag to orbit · Scroll to zoom · Move pointer to stir
    </p>

    <button id="motion">
      Pause motion
    </button>
  </div>

  <!-- 画面下部のテキスト -->
  <div class="hint">
    ✦ 3D TYPOGRAPHIC LIFEFORM
  </div>

  <!-- 3Dアニメーション -->
  <script type="module" src="./main.js"></script>

</body>
</html>
